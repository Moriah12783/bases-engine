# Service Bases — ordonnancement (§8 du brief).
# ⚠️ Crons DÉSACTIVÉS jusqu'à ce que le premier `contract-check` complet (workflow_dispatch manuel) passe.
#    Pour activer : décommenter le bloc `schedule` ci-dessous (décision écrite de Steph).
name: bases
run-name: ${{ github.event_name == 'schedule' && format('cron {0}', github.event.schedule) || format('{0} · {1}', inputs.command, inputs.source) }}

on:
  # Propriété des lignes cron : la personne qui a modifié ces lignes en dernier reçoit les notifications
  # d'échec des exécutions planifiées. Steph en est l'auteur de référence : ne pas les retoucher sans le signaler.
  schedule:
    - cron: '7 9 * * *'     # matin : édition des bases (instantané 08h30 UTC attendu vers 08h45)
    - cron: '35 9 * * *'    # rattrapage idempotent (retard de cron GitHub ou instantané tardif)
    - cron: '5 22 * * *'    # soir : notation J et J-7..J-1, mesure T15, palmarès, déploiement
    - cron: '30 7 * * 1'    # lundi : recalibration + rapport hebdomadaire (sprint 3)
    - cron: '20 11-21 * * *'  # resultats : passe horaire (sprint 4) — à décommenter par Steph
    - cron: '40 23 * * *'     # soir (rattrapage idempotent, auto-réparateur) — à décommenter par Steph avec la ligne horaire
  workflow_dispatch:
    inputs:
      command:
        description: "matin | soir | resultats | hebdo | backtest | contract-check | pages-init (création du projet Pages, dispatch uniquement)"
        default: "contract-check"
        required: true
      date:
        description: "Date J (AAAA-MM-JJ) ; vide = aujourd'hui (UTC)"
        default: ""
        required: false
      source:
        description: "Origine du déclenchement"
        type: choice
        options: [manuel, metronome]
        default: manuel

permissions:
  contents: write

concurrency:
  group: bases-engine
  cancel-in-progress: false

env:
  PUBLICATION_MODE: ${{ vars.PUBLICATION_MODE || 'shadow' }}
  NOTIFY_CHANNELS: ${{ vars.NOTIFY_CHANNELS || 'summary,journal' }}
  SHADOW_TOKEN: ${{ secrets.SHADOW_TOKEN }}
  TELEGRAM_BOT_TOKEN_BASES: ${{ secrets.TELEGRAM_BOT_TOKEN_BASES }}
  TELEGRAM_CHAT_ID_SHADOW: ${{ secrets.TELEGRAM_CHAT_ID_SHADOW }}
  TELEGRAM_CHAT_ID_LIVE: ${{ secrets.TELEGRAM_CHAT_ID_LIVE }}

jobs:
  bases:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # le soir auto-réparateur peut relire jusqu'à 8 journées à ≤ 1 requête/minute
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Commande à exécuter (cron → déduite de l'heure UTC ; dispatch → saisie)
        id: cmd
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CMD="${{ github.event.inputs.command }}"; DATE="${{ github.event.inputs.date }}"
            DECLENCHEUR="${{ github.event.inputs.source || 'manuel' }}"    # manuel | metronome
          else
            DECLENCHEUR=cron
            # Commande dérivée de l'expression cron déclenchante (jamais de l'heure courante : un cron peut être servi
            # avec plusieurs heures de retard — le soir du 21/09 a tourné à 00:36 UTC le 22/09).
            case "${{ github.event.schedule }}" in
              "5 22 * * *")      CMD=soir ;;
              "40 23 * * *")     CMD=soir ;;
              "30 7 * * 1")      CMD=hebdo ;;
              "20 11-21 * * *")  CMD=resultats ;;
              *)                 CMD=matin ;;
            esac
            DATE=""
            H=$(date -u +%H)
            # soir / resultats servis après minuit UTC : la journée visée est la veille
            if { [ "$CMD" = "soir" ] || [ "$CMD" = "resultats" ]; } && [ "$H" -lt 6 ]; then DATE=$(date -u -d yesterday +%F); fi
          fi
          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"; echo "date=$DATE" >> "$GITHUB_OUTPUT"; echo "declencheur=$DECLENCHEUR" >> "$GITHUB_OUTPUT"
          echo "Commande : $CMD ${DATE:+--date $DATE} (déclencheur : $DECLENCHEUR)"

      - name: pages-init — création idempotente du projet Cloudflare Pages (workflow_dispatch uniquement)
        id: pages_init
        if: steps.cmd.outputs.cmd == 'pages-init'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_BASES }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "⛔ pages-init n'est autorisé que par workflow_dispatch" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "⛔ pages-init : secrets CLOUDFLARE_API_TOKEN_BASES / CLOUDFLARE_ACCOUNT_ID absents" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          if npx --yes wrangler@4 pages project list 2>/dev/null | grep -qw "bases-elite-turf"; then
            echo "## ✅ pages-init — le projet Pages \`bases-elite-turf\` existe déjà (rien à faire)" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          set +e
          OUT=$(npx --yes wrangler@4 pages project create bases-elite-turf --production-branch=main 2>&1); RC=$?
          set -e
          echo "$OUT"
          if [ $RC -eq 0 ]; then
            echo "## ✅ pages-init — projet Pages \`bases-elite-turf\` créé (branche de production main). Étape suivante : rattacher bases.elite-turf.fr dans le tableau de bord Pages." >> "$GITHUB_STEP_SUMMARY"
          elif echo "$OUT" | grep -qi "already exists"; then
            echo "## ✅ pages-init — le projet Pages \`bases-elite-turf\` existe déjà (rien à faire)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ⛔ pages-init — échec de la création du projet Pages" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; echo "$OUT" | tail -20 >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi

      - name: Exécution
        id: run
        if: steps.cmd.outputs.cmd != 'pages-init'
        run: |
          ARGS=""
          case "${{ steps.cmd.outputs.cmd }}" in
            backtest) ARGS="--since 2026-08-25 --horizon T_MATIN" ;;
            matin|soir|resultats|contract-check|show) [ -n "${{ steps.cmd.outputs.date }}" ] && ARGS="--date ${{ steps.cmd.outputs.date }}" ;;
          esac
          if [ "${{ steps.cmd.outputs.cmd }}" = "matin" ] && [ -z "${{ secrets.CLOUDFLARE_API_TOKEN_BASES }}" ]; then ARGS="$ARGS --dry-run"; fi
          python -m bases_engine --declencheur "${{ steps.cmd.outputs.declencheur }}" ${{ steps.cmd.outputs.cmd }} $ARGS

      - name: Résumé de secours — seulement si l'exécution n'a écrit aucun résumé (marqueur .cache/summary_written absent)
        if: failure()
        run: |
          if [ ! -e .cache/summary_written ]; then
            echo "## ⛔ BASES — ${{ steps.cmd.outputs.cmd }} a échoué avant d'écrire son résumé — voir les logs du run. Action requise : Steph." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit des artefacts (chemins existants seulement ; toujours exécuté pour committer ALERTES.md)
        if: always()
        run: |
          git config user.name "bases-engine[bot]"
          git config user.email "bases-engine@users.noreply.github.com"
          for p in bases.db params.json site rapports PROTOCOLE_PREENREGISTRE.md CHANGELOG.md; do
            [ -e "$p" ] && git add -A -- "$p" || true
          done
          if git diff --cached --quiet; then echo "rien à committer"; exit 0; fi
          git commit -m "Bases: ${{ steps.cmd.outputs.cmd }} $(date -u +%F) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && exit 0
            echo "push tentative $i échouée, nouvel essai dans 10 s"; sleep 10
          done
          echo "⛔ push impossible après 3 tentatives (jamais de force-push)"; exit 1

      - name: Déploiement Cloudflare Pages (seulement si CE run a reconstruit le site — marqueur .cache/site_built ; sauté sans secrets)
        # La commande ne décide plus du déploiement : un run matin/soir sorti en répétition ne reconstruit pas site/shadow/
        # (ignoré par git) et déployait une page neutre seule → pages shadow effacées en ligne (23/09/2026 14:24 UTC).
        # À l'inverse, resultats reconstruit la page et doit être déployée. Le marqueur est écrit par build_site (jamais en dry-run).
        if: success() && env.CLOUDFLARE_API_TOKEN_BASES != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_BASES }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN_BASES: ${{ secrets.CLOUDFLARE_API_TOKEN_BASES }}
        run: |
          if [ ! -s .cache/site_built ]; then
            echo "## ⏭ Déploiement sauté — ${{ steps.cmd.outputs.cmd }} n'a pas reconstruit le site (répétition, renoncement, dry-run ou commande sans page) : la version en ligne est conservée." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx --yes wrangler@4 pages deploy site --project-name=bases-elite-turf --branch=main --commit-dirty=true
          echo "## 🚀 Déploiement Cloudflare Pages — site reconstruit par ce run ($(cat .cache/site_built))" >> "$GITHUB_STEP_SUMMARY"
