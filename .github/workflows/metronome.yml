name: Métronome · déploiement

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: metronome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Déployer le Worker (code + crons)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_METRONOME }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Poser le jeton GitHub dans le Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_METRONOME }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JETON: ${{ secrets.METRONOME_GH_TOKEN }}
        run: printf '%s' "$JETON" | npx --yes wrangler@4 secret put GH_DISPATCH_TOKEN
      - name: Résumé
        run: |
          {
            echo "## Métronome déployé"
            echo "- Worker : bases-metronome"
            echo "- Crons : 5 9,11,13 * * * (matin) · 3 22 * * * (soir) · 28 7 * * MON (hebdo) · 18 11-21 * * * (resultats)"
            echo "- Vérifier dans Cloudflare → Workers & Pages → bases-metronome → Settings → Triggers"
          } >> "$GITHUB_STEP_SUMMARY"
